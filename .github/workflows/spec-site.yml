name: Deploy Spec Site

on:
  push:
    branches: [main]
    paths:
      - "spec/**"
      - "docs/**"
      - "crates/declart-wasm/**"
      - ".github/workflows/spec-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install mdBook
        run: |
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.40/mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz --directory=/usr/local/bin

      - name: Copy spec into docs/src
        run: |
          cp spec/principles.md docs/src/principles.md
          cp spec/schema.md docs/src/schema.md
          mkdir -p docs/src/kinds
          for f in spec/kinds/*.md; do
            cp "$f" "docs/src/kinds/$(basename "$f")"
          done

      - name: Build WASM for playground
        run: |
          wasm-pack build crates/declart-wasm --target web \
            --out-dir /tmp/wasm-pkg --release

      - name: Build spec site
        run: mdbook build docs/

      - name: Copy WASM into book output
        run: |
          mkdir -p docs/book/playground/wasm
          cp /tmp/wasm-pkg/declart_wasm.js \
             /tmp/wasm-pkg/declart_wasm_bg.wasm \
             docs/book/playground/wasm/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
