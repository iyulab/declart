name: Deploy Spec Site

on:
  push:
    branches: [main]
    paths:
      - "spec/**"
      - "docs/**"
      - "crates/declart-wasm/**"
      - ".github/workflows/spec-site.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install mdBook
        run: |
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.40/mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz --directory=/usr/local/bin

      - name: Copy spec into docs/src
        run: |
          cp spec/principles.md docs/src/principles.md
          cp spec/schema.md docs/src/schema.md
          mkdir -p docs/src/kinds
          for f in spec/kinds/*.md; do
            cp "$f" "docs/src/kinds/$(basename "$f")"
          done

      - name: Build WASM for playground
        run: |
          mkdir -p docs/src/playground/wasm
          wasm-pack build crates/declart-wasm --target web \
            --out-dir "$(pwd)/docs/src/playground/wasm" --release

      - name: Build spec site
        run: mdbook build docs/

      - name: Copy WASM into book output
        run: cp -r docs/src/playground/wasm docs/book/playground/wasm

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/book
          force_orphan: true
