name: Publish crates.io

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-publish-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # Publishes in dependency order: declart-core first, then the crates that
      # depend on it. wasm/ffi are publish=false (distributed via npm / binaries).
      # Each publish is idempotent (skips a version already on crates.io) so a
      # re-run after a partial failure is safe.
      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Publishing version ${VERSION}"

          is_published() {
            curl -s "https://crates.io/api/v1/crates/$1/${VERSION}" \
              | grep -q "\"num\":\"${VERSION}\""
          }

          publish_if_needed() {
            local crate="$1"
            if is_published "${crate}"; then
              echo "✓ ${crate}@${VERSION} already on crates.io — skipping"
            else
              echo "→ publishing ${crate}@${VERSION}"
              cargo publish -p "${crate}" --token "${CARGO_REGISTRY_TOKEN}"
            fi
          }

          wait_for_crate() {
            local crate="$1"
            for i in $(seq 1 30); do
              if is_published "${crate}"; then
                echo "✓ ${crate}@${VERSION} available on index"
                return 0
              fi
              echo "… waiting for ${crate}@${VERSION} to propagate ($i/30)"
              sleep 10
            done
            echo "✗ ${crate}@${VERSION} did not appear within timeout"
            return 1
          }

          # 1. Core first — every other crate depends on it.
          publish_if_needed declart-core
          wait_for_crate declart-core

          # 2. Crates that depend on declart-core (version-pinned).
          publish_if_needed declart-cli
          publish_if_needed mdbook-declart
