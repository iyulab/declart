<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Declart Playground</title>
  <style>
    :root {
      --bg: #f5f7fa;
      --surface: #ffffff;
      --editor-bg: #1e1e2e;
      --editor-text: #cdd6f4;
      --border: #e2e8f0;
      --header-bg: #1a2540;
      --header-text: #e2e8f0;
      --label: #64748b;
      --accent: #3b82f6;
      --ok: #16a34a;
      --err-bg: #fff0f0;
      --err-border: #fca5a5;
      --err-text: #b91c1c;
      --radius: 6px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: #1e293b;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      background: var(--header-bg);
      color: var(--header-text);
      padding: 10px 20px;
      display: flex;
      align-items: baseline;
      gap: 16px;
      flex-shrink: 0;
    }

    header h1 { font-size: 1.05rem; font-weight: 600; letter-spacing: 0.03em; }
    header p  { font-size: 0.78rem; color: #94a3b8; }
    .header-links { margin-left: auto; display: flex; align-items: center; gap: 14px; }
    .header-links a {
      font-size: 0.75rem; color: #94a3b8; text-decoration: none; font-weight: 500;
      padding: 3px 8px; border: 1px solid #334155; border-radius: 4px;
      transition: color 0.15s, border-color 0.15s;
    }
    .header-links a:hover { color: #e2e8f0; border-color: #64748b; }
    .header-badge { font-size: 0.68rem; color: #64748b; font-family: monospace; }

    footer {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 5px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      font-size: 0.7rem;
      color: var(--label);
    }
    footer a { color: var(--label); text-decoration: none; }
    footer a:hover { color: var(--accent); }

    .controls {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 7px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    .controls label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      color: var(--label);
      font-weight: 500;
    }

    .controls select {
      font-size: 0.8rem;
      padding: 3px 7px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg);
      color: #1e293b;
      cursor: pointer;
    }

    #status {
      margin-left: auto;
      font-size: 0.74rem;
      color: var(--label);
    }
    #status.loading { color: var(--accent); }
    #status.ok      { color: var(--ok); }
    #status.err     { color: var(--err-text); }

    #share-btn {
      font-size: 0.75rem; padding: 3px 10px;
      border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--bg); color: var(--label); cursor: pointer; font-weight: 500;
    }
    #share-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
    #share-btn.copied { background: var(--ok); color: #fff; border-color: var(--ok); }

    .main {
      display: grid;
      grid-template-columns: 1fr 4px 1fr;
      flex: 1;
      overflow: hidden;
    }

    .resize-handle {
      background: var(--border);
      cursor: col-resize;
      transition: background 0.15s;
    }
    .resize-handle:hover,
    .resize-handle.dragging { background: var(--accent); }

    .pane {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
    }

    .pane-label {
      padding: 5px 14px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--label);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .pane-btn {
      font-size: 0.68rem;
      padding: 2px 8px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg);
      color: var(--label);
      cursor: pointer;
      font-weight: 500;
      text-transform: none;
      letter-spacing: 0;
    }
    .pane-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
    .pane-btn:disabled { opacity: 0.4; cursor: default; }

    #input {
      flex: 1;
      padding: 16px;
      font-family: "Cascadia Code", "JetBrains Mono", "Fira Code", Consolas, monospace;
      font-size: 0.82rem;
      line-height: 1.65;
      background: var(--editor-bg);
      color: var(--editor-text);
      border: none;
      resize: none;
      outline: none;
      tab-size: 2;
    }

    .preview-area {
      flex: 1;
      overflow: hidden;
      min-height: 0;
      background: var(--surface);
      cursor: grab;
      user-select: none;
    }
    .preview-area.panning { cursor: grabbing; }

    #preview {
      transform-origin: 0 0;
      will-change: transform;
      padding: 20px;
      display: inline-block;
    }

    #preview svg {
      display: block;
    }

    #zoom-hint {
      position: absolute;
      bottom: 8px; right: 12px;
      font-size: 0.65rem;
      color: var(--label);
      opacity: 0.7;
      pointer-events: none;
    }

    #error {
      margin-top: 12px;
      padding: 10px 14px;
      background: var(--err-bg);
      border: 1px solid var(--err-border);
      border-radius: var(--radius);
      color: var(--err-text);
      font-family: "Cascadia Code", Consolas, monospace;
      font-size: 0.78rem;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .hidden { display: none !important; }

    #custom-theme-bar {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 6px 20px;
      background: #f0f4ff;
      border-bottom: 1px solid #c7d3f5;
      flex-shrink: 0;
    }
    #custom-theme-bar label {
      font-size: 0.75rem;
      color: var(--label);
      font-weight: 600;
      white-space: nowrap;
      padding-top: 4px;
    }
    #theme-input {
      flex: 1;
      height: 80px;
      font-family: "Cascadia Code", Consolas, monospace;
      font-size: 0.75rem;
      line-height: 1.5;
      padding: 6px 10px;
      border: 1px solid #c7d3f5;
      border-radius: var(--radius);
      background: var(--editor-bg);
      color: var(--editor-text);
      resize: vertical;
    }

    @media (max-width: 680px) {
      body { overflow: auto; }
      .main { grid-template-columns: 1fr !important; height: auto; }
      .resize-handle { display: none; }
      #input { min-height: 220px; }
      .pane { border-bottom: 1px solid var(--border); }
    }
  </style>
</head>
<body>

<header>
  <h1>Declart Playground</h1>
  <p>Edit TOML on the left — see your diagram instantly on the right</p>
  <div class="header-links">
    <span class="header-badge">v0.17.1</span>
    <a href="https://github.com/iyulab/declart" target="_blank" rel="noopener">GitHub</a>
    <a href="../introduction.html" target="_blank" rel="noopener">Docs</a>
  </div>
</header>

<div class="controls">
  <label>
    Example
    <select id="example-select">
      <option value="flow_process">Flow (process) — Software Release Pipeline</option>
      <option value="flow_cycle">Flow (cycle) — PDCA</option>
      <option value="flow_funnel">Flow (funnel) — Marketing Conversion</option>
      <option value="tier">Tier — Maslow's Hierarchy</option>
      <option value="hierarchy_org">Hierarchy (org_chart) — Engineering Division</option>
      <option value="hierarchy_fishbone">Hierarchy (fishbone) — Website Performance</option>
      <option value="hierarchy_mind_map">Hierarchy (mind_map) — Machine Learning</option>
      <option value="matrix">Matrix — Eisenhower Matrix</option>
      <option value="hub_spoke">Hub-and-Spoke — Cloud Architecture</option>
      <option value="venn">Venn — Skills Overlap</option>
      <option value="timeline">Timeline — Product Launch</option>
      <option value="comparison">Comparison — Framework Analysis</option>
      <option value="flow_swimlane">Flow (swimlane) — Order Processing</option>
      <option value="state">State — Order Lifecycle</option>
    </select>
  </label>
  <label>
    Theme
    <select id="theme-select">
      <option value="default">Default</option>
      <option value="monochrome">Monochrome</option>
      <option value="accessible">Accessible</option>
      <option value="warm">Warm</option>
      <option value="custom">Custom…</option>
    </select>
  </label>
  <span id="status" class="loading">Loading WASM…</span>
  <button id="share-btn" title="Copy shareable link to clipboard">🔗 Share</button>
</div>

<div id="custom-theme-bar" class="hidden">
  <label>Theme TOML</label>
  <textarea id="theme-input" spellcheck="false" autocomplete="off" placeholder="[colors]&#10;apex       = &quot;#003087&quot;&#10;base       = &quot;#B8D0E8&quot;&#10;background = &quot;#FFFFFF&quot;&#10;on_dark    = &quot;#FFFFFF&quot;&#10;on_light   = &quot;#003087&quot;&#10;title      = &quot;#003087&quot;"></textarea>
</div>

<div class="main" id="main-grid">
  <div class="pane">
    <div class="pane-label">TOML Input</div>
    <textarea id="input" spellcheck="false" autocomplete="off" autocorrect="off"></textarea>
  </div>
  <div class="resize-handle" id="resize-handle" title="Drag to resize"></div>
  <div class="pane">
    <div class="pane-label">
      SVG Preview
      <span style="display:flex;gap:6px;align-items:center">
        <button id="reset-zoom" class="pane-btn" title="Reset zoom (double-click)">⤢ Fit</button>
        <button id="download-svg" class="pane-btn" disabled title="Download SVG">↓ SVG</button>
      </span>
    </div>
    <div class="preview-area" id="preview-area" style="position:relative">
      <div id="preview"></div>
      <span id="zoom-hint">scroll to zoom · drag to pan · dbl-click to reset</span>
    </div>
    <div id="error" class="hidden"></div>
  </div>
</div>

<footer>
  <span>Declart v0.18.0 &nbsp;·&nbsp; MIT License</span>
  <span>
    <a href="https://github.com/iyulab/declart" target="_blank" rel="noopener">GitHub</a>
    &nbsp;·&nbsp;
    <a href="../introduction.html" target="_blank" rel="noopener">Docs</a>
    &nbsp;·&nbsp;
    <a href="https://github.com/iyulab/declart/issues" target="_blank" rel="noopener">Feedback</a>
  </span>
</footer>

// Panel resize
const mainGrid    = document.getElementById('main-grid');
const resizeHandle = document.getElementById('resize-handle');
let dragging = false;

resizeHandle.addEventListener('mousedown', e => {
  dragging = true;
  resizeHandle.classList.add('dragging');
  document.body.style.cursor = 'col-resize';
  document.body.style.userSelect = 'none';
  e.preventDefault();
});

document.addEventListener('mousemove', e => {
  if (!dragging) return;
  const rect = mainGrid.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const total = rect.width - 4; // subtract handle width
  const leftFr = Math.max(0.15, Math.min(0.85, x / total));
  const rightFr = 1 - leftFr;
  mainGrid.style.gridTemplateColumns = `${leftFr}fr 4px ${rightFr}fr`;
});

document.addEventListener('mouseup', () => {
  if (!dragging) return;
  dragging = false;
  resizeHandle.classList.remove('dragging');
  document.body.style.cursor = '';
  document.body.style.userSelect = '';
});

const inputEl        = document.getElementById('input');
const previewEl      = document.getElementById('preview');
const previewArea    = document.getElementById('preview-area');
const errorEl        = document.getElementById('error');
const exampleSel     = document.getElementById('example-select');
const themeSel       = document.getElementById('theme-select');
const statusEl       = document.getElementById('status');
const downloadBtn    = document.getElementById('download-svg');
const resetZoomBtn   = document.getElementById('reset-zoom');
const shareBtn       = document.getElementById('share-btn');
const customThemeBar = document.getElementById('custom-theme-bar');
const themeInputEl   = document.getElementById('theme-input');
const svgParser    = new DOMParser();
const DRAFT_KEY    = 'declart-draft';

// Zoom / Pan state
let zScale = 1, zTx = 0, zTy = 0;
let panning = false, panOriginX = 0, panOriginY = 0;

function applyZoom() {
  previewEl.style.transform = `translate(${zTx}px, ${zTy}px) scale(${zScale})`;
}

function fitView() {
  const svgEl = previewEl.querySelector('svg');
  if (!svgEl) { zScale = 1; zTx = 20; zTy = 20; applyZoom(); return; }
  const aw = previewArea.clientWidth;
  const ah = previewArea.clientHeight;
  const svgW = parseFloat(svgEl.getAttribute('width')) || 860;
  const svgH = parseFloat(svgEl.getAttribute('height')) || 500;
  zScale = Math.min(1, (aw - 40) / svgW, (ah - 40) / svgH);
  zTx = Math.max(20, (aw - svgW * zScale) / 2);
  zTy = Math.max(20, (ah - svgH * zScale) / 2);
  applyZoom();
}

previewArea.addEventListener('wheel', e => {
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
  const rect = previewArea.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  zTx = mx - (mx - zTx) * factor;
  zTy = my - (my - zTy) * factor;
  zScale = Math.max(0.1, Math.min(10, zScale * factor));
  applyZoom();
}, { passive: false });

previewArea.addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  panning = true;
  panOriginX = e.clientX - zTx;
  panOriginY = e.clientY - zTy;
  previewArea.classList.add('panning');
  e.preventDefault();
});

document.addEventListener('mousemove', e => {
  if (!panning) return;
  zTx = e.clientX - panOriginX;
  zTy = e.clientY - panOriginY;
  applyZoom();
});

document.addEventListener('mouseup', () => {
  if (!panning) return;
  panning = false;
  previewArea.classList.remove('panning');
});

previewArea.addEventListener('dblclick', fitView);
resetZoomBtn.addEventListener('click', fitView);

function tomlToHash(toml) {
  try { return btoa(encodeURIComponent(toml)); } catch (_) { return null; }
}

function hashToToml(hash) {
  try { return decodeURIComponent(atob(hash)); } catch (_) { return null; }
}

function getPermalink() {
  const url = new URL(location.href);
  url.searchParams.set('d', tomlToHash(inputEl.value) || '');
  return url.toString();
}

function updateUrl() {
  const hash = tomlToHash(inputEl.value);
  if (!hash) return;
  const url = new URL(location.href);
  url.searchParams.set('d', hash);
  history.replaceState(null, '', url.toString());
}

let wasmReady = false;

function saveDraft() {
  try { localStorage.setItem(DRAFT_KEY, inputEl.value); } catch (_) {}
}

function loadDraft() {
  try { return localStorage.getItem(DRAFT_KEY); } catch (_) { return null; }
}

function clearDraft() {
  try { localStorage.removeItem(DRAFT_KEY); } catch (_) {}
}

function showSvg(svgString) {
  const doc = svgParser.parseFromString(svgString, 'image/svg+xml');
  const root = doc.documentElement;
  if (root.nodeName === 'parsererror') {
    throw new Error('SVG parse error: ' + (root.textContent || 'unknown'));
  }
  previewEl.replaceChildren(root);
  downloadBtn.disabled = false;
  fitView();
}

function extractLineCol(msg) {
  const m = msg.match(/at line (\d+), column (\d+)/);
  return m ? { line: parseInt(m[1], 10), col: parseInt(m[2], 10) } : null;
}

function jumpEditorToLine(line, col) {
  const lines = inputEl.value.split('\n');
  let offset = 0;
  for (let i = 0; i < line - 1 && i < lines.length; i++) offset += lines[i].length + 1;
  const end = offset + (lines[line - 1]?.length ?? 0);
  inputEl.setSelectionRange(offset + col - 1, end);
  inputEl.focus();
}

const DEFAULT_CUSTOM_THEME = `[colors]
apex       = "#003087"
base       = "#B8D0E8"
background = "#FFFFFF"
on_dark    = "#FFFFFF"
on_light   = "#003087"
title      = "#003087"`;

function update() {
  if (!wasmReady) return;
  try {
    const isCustom = themeSel.value === 'custom';
    const svg = isCustom
      ? render_with_theme_toml(inputEl.value, themeInputEl.value || DEFAULT_CUSTOM_THEME, undefined)
      : render(inputEl.value, themeSel.value, undefined);
    showSvg(svg);
    errorEl.textContent = '';
    errorEl.classList.add('hidden');
    statusEl.textContent = '✓ OK';
    statusEl.className = 'ok';
    updateUrl();
  } catch (e) {
    previewEl.replaceChildren();
    downloadBtn.disabled = true;
    const msg = e.message || String(e);
    const loc = extractLineCol(msg);
    errorEl.textContent = msg;
    errorEl.classList.remove('hidden');
    statusEl.textContent = loc ? `✗ Line ${loc.line}` : '✗ Error';
    statusEl.className = 'err';
    if (loc) jumpEditorToLine(loc.line, loc.col);
  }
}

shareBtn.addEventListener('click', async () => {
  const url = getPermalink();
  try {
    await navigator.clipboard.writeText(url);
    shareBtn.textContent = '✓ Copied!';
    shareBtn.classList.add('copied');
    setTimeout(() => {
      shareBtn.textContent = '🔗 Share';
      shareBtn.classList.remove('copied');
    }, 2000);
  } catch (_) {
    prompt('Copy this link:', url);
  }
});

downloadBtn.addEventListener('click', () => {
  const svgEl = previewEl.querySelector('svg');
  if (!svgEl) return;
  const blob = new Blob([svgEl.outerHTML], { type: 'image/svg+xml' });
  const a = Object.assign(document.createElement('a'), {
    href: URL.createObjectURL(blob),
    download: 'diagram.svg',
  });
  a.click();
  URL.revokeObjectURL(a.href);
});

exampleSel.addEventListener('change', () => {
  inputEl.value = EXAMPLES[exampleSel.value] ?? '';
  clearDraft();
  update();
});

themeSel.addEventListener('change', () => {
  const isCustom = themeSel.value === 'custom';
  customThemeBar.classList.toggle('hidden', !isCustom);
  if (isCustom && !themeInputEl.value) themeInputEl.value = DEFAULT_CUSTOM_THEME;
  update();
});

themeInputEl.addEventListener('input', update);

inputEl.addEventListener('input', () => {
  saveDraft();
  update();
});

(async () => {
  try {
    await init();
    wasmReady = true;
    statusEl.textContent = '✓ Ready';
    statusEl.className = 'ok';
    // Priority: URL ?d= param > draft > default example
    const urlHash = new URLSearchParams(location.search).get('d');
    const urlToml = urlHash ? hashToToml(urlHash) : null;
    const draft = loadDraft();
    inputEl.value = urlToml ?? draft ?? EXAMPLES[exampleSel.value];
    update();
  } catch (e) {
    statusEl.textContent = '✗ WASM load failed';
    statusEl.className = 'err';
    errorEl.textContent =
      'Failed to load WASM module.\n' +
      'Serve via HTTP: mdbook serve docs/  (opening index.html as file:// will not work)\n\n' +
      (e.message || String(e));
    errorEl.classList.remove('hidden');
  }
})();
</script>

</body>
</html>
