[package]
name = "declart-ffi"
version = "0.15.1"
edition = "2021"
description = "C ABI bindings for Declart — produces .dll/.so/.dylib for use from Python, C#, Node.js, and other languages"
license = "MIT"
repository = "https://github.com/iyulab/declart"

[lib]
crate-type = ["cdylib"]

[dependencies]
declart-core = { path = "../declart-core" }
