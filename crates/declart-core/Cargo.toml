[package]
name = "declart-core"
version = "0.19.0"
edition = "2021"
description = "Declarative prose-diagram engine — parse TOML/JSON declarations and render SVG"
license = "MIT"
repository = "https://github.com/iyulab/declart"
readme = "../../README.md"
keywords = ["diagram", "svg", "declarative", "toml", "visualization"]
categories = ["visualization", "rendering"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
fontdue = "0.9"
thiserror = "2"
