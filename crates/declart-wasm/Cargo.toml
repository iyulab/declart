[package]
name = "declart-wasm"
version = "0.19.0"
edition = "2021"
description = "WebAssembly bindings for Declart — declarative diagram engine"
license = "MIT"
repository = "https://github.com/iyulab/declart"
# Primary distribution is npm (@iyulab/declart, @iyulab/declart-web) via wasm-pack, not crates.io.
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
declart-core = { path = "../declart-core" }
wasm-bindgen = "0.2"

[dev-dependencies]
wasm-bindgen-test = "0.3"
